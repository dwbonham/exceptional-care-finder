name: Weekly Data Pipeline

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 6 am PT
    - cron: '0 14 * * 0,2-6' # Tue-Sun 6 am PT catch-up
  workflow_dispatch:
    inputs:
      enrich_counties:
        description: 'Counties to enrich (e.g. butte,riverside). Blank = all queued counties.'
        required: false
        type: string
        default: ''
      with_sentiment:
        description: 'Include sentiment research (2 API calls/program instead of 1)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install

      - name: Restore pipeline checkpoint
        uses: actions/cache@v4
        with:
          path: scripts/pipeline/checkpoint.json
          key: pipeline-checkpoint-${{ github.run_id }}
          restore-keys: |
            pipeline-checkpoint-

      - name: Write service account credentials
        run: |
          echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > /tmp/sa.json
          SA_EMAIL=$(jq -r .client_email /tmp/sa.json 2>/dev/null || echo "could not parse")
          echo "Service account email: $SA_EMAIL"
          echo "Sheet ID: ${{ vars.SHEET_ID }}"

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_PATH: /tmp/sa.json
          ENRICH_COUNTIES: ${{ inputs.enrich_counties || '' }}
          WITH_SENTIMENT: ${{ inputs.with_sentiment || '' }}
        run: bun run pipeline

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit approved programs
        id: commit
        run: |
          git add program-data/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new approved programs this run."
            exit 0
          fi
          COUNTY_FILES=$(git diff --staged --name-only | grep -c 'programs\.json' || true)
          git checkout -B pipeline/weekly-update
          git commit -m "pipeline: $(date -u '+%Y-%m-%d') - ${COUNTY_FILES} county file(s) updated"
          git push -f origin pipeline/weekly-update
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --head pipeline/weekly-update --state open --json number --jq length)
          if [ "$OPEN" != "0" ]; then
            echo "PR already open - new commit pushed, no duplicate PR needed."
            exit 0
          fi
          gh pr create \
            --base main \
            --head pipeline/weekly-update \
            --title "Pipeline: $(date -u '+%Y-%m-%d') weekly program update" \
            --body "## Weekly Pipeline Update

          Opened automatically by the CCLD data pipeline.

          **Before merging:**
          - [ ] Program count in the diff looks reasonable
          - [ ] Spot-check 1-2 entries in program-data/ look correct
          - [ ] No unexpected counties or states

          Merge to publish. Site deploys automatically."
